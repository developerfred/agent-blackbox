name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, and the output of `blackbox status`.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version, OS and Node
      placeholder: "0.3.0, macOS 15, Node 22"
    validations: { required: true }
